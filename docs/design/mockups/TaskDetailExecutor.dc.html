<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>任务详情（执行者）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1d4ed8}a:hover{color:#1e40af}
</style>
</helmet>
<div style="box-sizing: border-box; min-height: 100vh; background: #fafafa; color: #18181b; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; font-size: 14px; line-height: 1.5">

<header style="background: #ffffff; border-bottom: 1px solid #e4e4e7">
<div style="box-sizing: border-box; max-width: 1200px; margin: 0 auto; padding: 0 clamp(16px, 3vw, 32px); min-height: 64px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px">
<a href="#" style="display: inline-flex; align-items: center; gap: 4px; min-height: 44px; color: #52525b; text-decoration: none"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"></path></svg>我的项目</a>
<span aria-hidden="true" style="color: #a1a1aa">/</span>
<span style="font-size: 16px; font-weight: 600">官网改版</span>
<span style="padding: 2px 8px; border-radius: 6px; background: #f4f4f5; color: #3f3f46; font-size: 13px; line-height: 20px">执行者</span>
</div>
</div>
</header>

<main style="box-sizing: border-box; max-width: 1200px; margin: 0 auto; padding: 16px clamp(16px, 3vw, 32px) 40px; display: flex; flex-direction: column; gap: 16px">

<a href="TasksExecutor.dc.html" style="display: inline-flex; align-items: center; align-self: flex-start; gap: 4px; min-height: 44px; color: #52525b; text-decoration: none"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"></path></svg>返回我的任务</a>

<h1 style="margin: 0; font-size: 24px; font-weight: 600; line-height: 32px">登录页接口联调</h1>

<section aria-labelledby="desc-title" style="box-sizing: border-box; background: #ffffff; border: 1px solid #e4e4e7; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 8px">
<h2 id="desc-title" style="margin: 0; font-size: 16px; font-weight: 600">描述</h2>
<p style="margin: 0; color: #3f3f46">把登录页和后端的登录接口接起来，账号或密码不对时显示统一提示。</p>
</section>

<section aria-labelledby="info-title" style="box-sizing: border-box; background: #ffffff; border: 1px solid #e4e4e7; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<h2 id="info-title" style="margin: 0; font-size: 16px; font-weight: 600">任务信息</h2>
<dl style="margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
<div><dt style="color: #52525b">任务负责人</dt><dd style="margin: 0">li.na@example.com</dd></div>
<div><dt style="color: #52525b">截止日期</dt><dd style="margin: 0; font-variant-numeric: tabular-nums">2026-11-12</dd></div>
</dl>
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<label for="task-status" style="color: #52525b">状态</label>
<select id="task-status" style="box-sizing: border-box; min-width: 160px; min-height: 44px; padding: 0 12px; border: 1px solid #d4d4d8; border-radius: 8px; background: #ffffff; color: #18181b; font: inherit">
<option>未开始</option>
<option selected="selected">进行中</option>
<option>已完成</option>
</select>
</div>
<button type="button" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border: 0; border-radius: 8px; background: #1d4ed8; color: #ffffff; font: inherit; font-weight: 500; cursor: pointer">保存状态</button>
</div>
</section>

</main>
</div>
</x-dc>

</body>
</html>
